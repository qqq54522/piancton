services:
  postgres:
    restart: unless-stopped
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-piancton}
      POSTGRES_USER: ${POSTGRES_USER:-piancton}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-piancton}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-piancton}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-piancton}
      STORAGE_DIR: /data/images
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      TOS_BUCKET: ${TOS_BUCKET:-}
      TOS_REGION: ${TOS_REGION:-cn-shanghai}
      TOS_ENDPOINT: ${TOS_ENDPOINT:-https://tos-cn-shanghai.volces.com}
      TOS_PREFIX: ${TOS_PREFIX:-piancton}
      TOS_ACCESS_KEY_ID: ${TOS_ACCESS_KEY_ID:-}
      TOS_SECRET_ACCESS_KEY: ${TOS_SECRET_ACCESS_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:5173,http://127.0.0.1:5173}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-80000000}
      THUMBNAIL_MAX_SIZE: ${THUMBNAIL_MAX_SIZE:-640}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_WINDOW_MINUTES: ${LOGIN_WINDOW_MINUTES:-15}
      LOGIN_BLOCK_MINUTES: ${LOGIN_BLOCK_MINUTES:-30}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-placeholder}
      MODEL_PROVIDER_ORDER: ${MODEL_PROVIDER_ORDER:-primary,fallback1,fallback2}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_TEMPERATURE: ${MODEL_TEMPERATURE:-0.2}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-120}
      IMAGE_ANALYSIS_MODEL_NAME: ${IMAGE_ANALYSIS_MODEL_NAME:-}
      IMAGE_ANALYSIS_BASE_URL: ${IMAGE_ANALYSIS_BASE_URL:-}
      IMAGE_ANALYSIS_API_KEY: ${IMAGE_ANALYSIS_API_KEY:-}
      IMAGE_ANALYSIS_TEMPERATURE: ${IMAGE_ANALYSIS_TEMPERATURE:-0.2}
      ASSET_PHRASE_MODEL_NAME: ${ASSET_PHRASE_MODEL_NAME:-}
      ASSET_PHRASE_BASE_URL: ${ASSET_PHRASE_BASE_URL:-}
      ASSET_PHRASE_API_KEY: ${ASSET_PHRASE_API_KEY:-}
      ASSET_PHRASE_TEMPERATURE: ${ASSET_PHRASE_TEMPERATURE:-0.2}
      SEARCH_FALLBACK_MODEL_NAME: ${SEARCH_FALLBACK_MODEL_NAME:-}
      SEARCH_FALLBACK_BASE_URL: ${SEARCH_FALLBACK_BASE_URL:-}
      SEARCH_FALLBACK_API_KEY: ${SEARCH_FALLBACK_API_KEY:-}
      SEARCH_FALLBACK_TEMPERATURE: ${SEARCH_FALLBACK_TEMPERATURE:-0.2}
      FALLBACK1_NAME: ${FALLBACK1_NAME:-}
      FALLBACK1_BASE_URL: ${FALLBACK1_BASE_URL:-}
      FALLBACK1_API_KEY: ${FALLBACK1_API_KEY:-}
      FALLBACK1_TEMPERATURE: ${FALLBACK1_TEMPERATURE:-0.2}
      FALLBACK2_NAME: ${FALLBACK2_NAME:-}
      FALLBACK2_BASE_URL: ${FALLBACK2_BASE_URL:-}
      FALLBACK2_API_KEY: ${FALLBACK2_API_KEY:-}
      FALLBACK2_TEMPERATURE: ${FALLBACK2_TEMPERATURE:-0.2}
      SEARCH_BACKEND: ${SEARCH_BACKEND:-database}
      MEILISEARCH_URL: ${MEILISEARCH_URL:-}
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-}
      MEILISEARCH_INDEX: ${MEILISEARCH_INDEX:-images}
      SEARCH_TIMEOUT_SECONDS: ${SEARCH_TIMEOUT_SECONDS:-2}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-10}
      EMBEDDING_TOP_N: ${EMBEDDING_TOP_N:-100}
      VIKINGDB_ENABLED: ${VIKINGDB_ENABLED:-false}
      VIKINGDB_SHADOW_MODE: ${VIKINGDB_SHADOW_MODE:-true}
      VIKINGDB_BASE_URL: ${VIKINGDB_BASE_URL:-https://api-vikingdb.vikingdb.cn-beijing.volces.com}
      VIKINGDB_API_KEY: ${VIKINGDB_API_KEY:-}
      VIKINGDB_COLLECTION_NAME: ${VIKINGDB_COLLECTION_NAME:-piancton_search_knowledge_clean}
      VIKINGDB_INDEX_NAME: ${VIKINGDB_INDEX_NAME:-piancton_search_knowledge_idx}
      VIKINGDB_TIMEOUT_SECONDS: ${VIKINGDB_TIMEOUT_SECONDS:-30}
      VIKINGDB_BATCH_SIZE: ${VIKINGDB_BATCH_SIZE:-100}
      VIKINGDB_UPSERT_PATH: ${VIKINGDB_UPSERT_PATH:-/api/vikingdb/data/upsert}
      VIKINGDB_SEARCH_PATH: ${VIKINGDB_SEARCH_PATH:-/api/vikingdb/data/search/multi_modal}
      VIKINGDB_SEARCH_LIMIT: ${VIKINGDB_SEARCH_LIMIT:-5}
      VIKINGDB_KNOWLEDGE_ROUTER_ENABLED: ${VIKINGDB_KNOWLEDGE_ROUTER_ENABLED:-false}
      VIKINGDB_SKILL_BACKUP_ENABLED: ${VIKINGDB_SKILL_BACKUP_ENABLED:-true}
      VIKINGDB_KNOWLEDGE_MIN_SCORE: ${VIKINGDB_KNOWLEDGE_MIN_SCORE:-0.34}
      VIKINGDB_KNOWLEDGE_MULTI_SCORE_RATIO: ${VIKINGDB_KNOWLEDGE_MULTI_SCORE_RATIO:-0.9}
      VIKINGDB_KNOWLEDGE_MULTI_SCORE_GAP: ${VIKINGDB_KNOWLEDGE_MULTI_SCORE_GAP:-0.08}
      VIKINGDB_KNOWLEDGE_MAX_MATCHES: ${VIKINGDB_KNOWLEDGE_MAX_MATCHES:-3}
      VIKINGDB_KNOWLEDGE_FALLBACK_ENABLED: ${VIKINGDB_KNOWLEDGE_FALLBACK_ENABLED:-false}
      VIKINGDB_KNOWLEDGE_FALLBACK_MIN_SCORE: ${VIKINGDB_KNOWLEDGE_FALLBACK_MIN_SCORE:-0.2}
      VIKINGDB_KNOWLEDGE_FALLBACK_MAX_MATCHES: ${VIKINGDB_KNOWLEDGE_FALLBACK_MAX_MATCHES:-1}
      VIKING_KNOWLEDGE_SERVICE_ENABLED: ${VIKING_KNOWLEDGE_SERVICE_ENABLED:-false}
      VIKING_KNOWLEDGE_SERVICE_BASE_URL: ${VIKING_KNOWLEDGE_SERVICE_BASE_URL:-https://api-knowledgebase.mlp.cn-beijing.volces.com}
      VIKING_KNOWLEDGE_SERVICE_API_KEY: ${VIKING_KNOWLEDGE_SERVICE_API_KEY:-}
      VIKING_KNOWLEDGE_SERVICE_RESOURCE_ID: ${VIKING_KNOWLEDGE_SERVICE_RESOURCE_ID:-}
      VIKING_KNOWLEDGE_SERVICE_PATH: ${VIKING_KNOWLEDGE_SERVICE_PATH:-/api/knowledge/service/chat}
      VIKING_KNOWLEDGE_SERVICE_TIMEOUT_SECONDS: ${VIKING_KNOWLEDGE_SERVICE_TIMEOUT_SECONDS:-12}
      VIKING_KNOWLEDGE_SERVICE_RESULT_LIMIT: ${VIKING_KNOWLEDGE_SERVICE_RESULT_LIMIT:-6}
      VIKING_KNOWLEDGE_SERVICE_MAX_MATCHES: ${VIKING_KNOWLEDGE_SERVICE_MAX_MATCHES:-4}
      AI_SEARCH_ENABLED: ${AI_SEARCH_ENABLED:-false}
      AI_SEARCH_SYNC_ENABLED: ${AI_SEARCH_SYNC_ENABLED:-true}
      AI_SEARCH_BASE_URL: ${AI_SEARCH_BASE_URL:-https://aisearch.cn-beijing.volces.com}
      AI_SEARCH_API_KEY: ${AI_SEARCH_API_KEY:-}
      AI_SEARCH_APPLICATION_ID: ${AI_SEARCH_APPLICATION_ID:-}
      AI_SEARCH_SEARCH_PATH: ${AI_SEARCH_SEARCH_PATH:-}
      AI_SEARCH_DATASET_ID: ${AI_SEARCH_DATASET_ID:-}
      AI_SEARCH_TIMEOUT_SECONDS: ${AI_SEARCH_TIMEOUT_SECONDS:-8}
      AI_SEARCH_PAGE_SIZE: ${AI_SEARCH_PAGE_SIZE:-10}
      AI_SEARCH_PUBLIC_BASE_URL: ${AI_SEARCH_PUBLIC_BASE_URL:-}
      RERANKER_BASE_URL: ${RERANKER_BASE_URL:-}
      RERANKER_API_KEY: ${RERANKER_API_KEY:-}
      RERANKER_MODEL_NAME: ${RERANKER_MODEL_NAME:-}
      RERANKER_TIMEOUT_SECONDS: ${RERANKER_TIMEOUT_SECONDS:-5}
      RERANKER_TOP_N: ${RERANKER_TOP_N:-50}
      SEARCH_TOTAL_TIMEOUT_SECONDS: ${SEARCH_TOTAL_TIMEOUT_SECONDS:-180}
      SEARCH_MEILISEARCH_TIMEOUT_SECONDS: ${SEARCH_MEILISEARCH_TIMEOUT_SECONDS:-0.2}
      SEARCH_EMBEDDING_TIMEOUT_SECONDS: ${SEARCH_EMBEDDING_TIMEOUT_SECONDS:-2.5}
      SEARCH_UNDERSTANDING_TIMEOUT_SECONDS: ${SEARCH_UNDERSTANDING_TIMEOUT_SECONDS:-75}
      SEARCH_SYSTEM_ROUTING_TIMEOUT_SECONDS: ${SEARCH_SYSTEM_ROUTING_TIMEOUT_SECONDS:-45}
      SEARCH_SELLING_POINT_TIMEOUT_SECONDS: ${SEARCH_SELLING_POINT_TIMEOUT_SECONDS:-60}
      SEARCH_PROOF_POINT_TIMEOUT_SECONDS: ${SEARCH_PROOF_POINT_TIMEOUT_SECONDS:-45}
      SEARCH_CANDIDATE_REVIEW_TIMEOUT_SECONDS: ${SEARCH_CANDIDATE_REVIEW_TIMEOUT_SECONDS:-45}
      SEARCH_RESULT_RECOMMENDATION_TIMEOUT_SECONDS: ${SEARCH_RESULT_RECOMMENDATION_TIMEOUT_SECONDS:-45}
      SEARCH_RESULT_RECOMMENDATION_LIMIT: ${SEARCH_RESULT_RECOMMENDATION_LIMIT:-12}
      SEARCH_CANDIDATE_REVIEW_LIMIT: ${SEARCH_CANDIDATE_REVIEW_LIMIT:-5}
      SEARCH_UNDERSTANDING_GRACE_SECONDS: ${SEARCH_UNDERSTANDING_GRACE_SECONDS:-5}
      SEARCH_UNDERSTANDING_RETRY_ATTEMPTS: ${SEARCH_UNDERSTANDING_RETRY_ATTEMPTS:-1}
      SEARCH_UNDERSTANDING_RETRY_BACKOFF_SECONDS: ${SEARCH_UNDERSTANDING_RETRY_BACKOFF_SECONDS:-1}
      SEARCH_RERANKER_TIMEOUT_SECONDS: ${SEARCH_RERANKER_TIMEOUT_SECONDS:-2}
      SEARCH_CANDIDATE_LIMIT: ${SEARCH_CANDIDATE_LIMIT:-20}
      SEARCH_CACHE_TTL_SECONDS: ${SEARCH_CACHE_TTL_SECONDS:-300}
      SEARCH_CACHE_MAX_ENTRIES: ${SEARCH_CACHE_MAX_ENTRIES:-512}
      API_CENTER_MAINTENANCE_ENABLED: ${API_CENTER_MAINTENANCE_ENABLED:-true}
      API_CENTER_MAINTENANCE_INTERVAL_MINUTES: ${API_CENTER_MAINTENANCE_INTERVAL_MINUTES:-360}
      API_CENTER_MAINTENANCE_STARTUP_DELAY_SECONDS: ${API_CENTER_MAINTENANCE_STARTUP_DELAY_SECONDS:-300}
      API_CENTER_MAINTENANCE_MAX_CREDENTIALS_PER_CYCLE: ${API_CENTER_MAINTENANCE_MAX_CREDENTIALS_PER_CYCLE:-20}
      API_CENTER_CALL_TRACE_RETENTION_DAYS: ${API_CENTER_CALL_TRACE_RETENTION_DAYS:-30}
      API_CENTER_HEALTH_CHECK_RETENTION_DAYS: ${API_CENTER_HEALTH_CHECK_RETENTION_DAYS:-90}
    volumes:
      - image_data:/data/images
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  meilisearch:
    restart: unless-stopped
    image: ${MEILISEARCH_IMAGE:-getmeili/meilisearch:v1.13}
    profiles: ["search"]
    environment:
      MEILI_ENV: ${MEILI_ENV:-production}
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-replace-with-a-search-master-key}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "${MEILISEARCH_PORT:-127.0.0.1:7700}:7700"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:22-alpine}
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE:-nginx:1.27-alpine}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  image_data:
  meilisearch_data:
