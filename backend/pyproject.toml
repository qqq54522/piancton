[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]

[tool.pyright]
pythonVersion = "3.9"
typeCheckingMode = "basic"
include = ["app", "scripts"]
exclude = ["alembic"]
reportMissingImports = false
venvPath = "."
venv = ".venv"
